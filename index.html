<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Snow Pals</title><style>*{box-sizing:border-box}body{margin:0;background:#09152d;color:white;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#173b70,#8ad7ff);z-index:5}.card{width:min(92vw,480px);padding:24px;border-radius:22px;background:#0a1837dd;text-align:center;box-shadow:0 15px 50px #0006}h1{margin:0 0 4px;font-size:42px}.sub{opacity:.8;margin-bottom:18px}.row{display:flex;gap:10px;margin:10px 0}button,input{font:inherit;border:0;border-radius:14px;padding:14px}button{background:#fff;color:#102040;font-weight:800;flex:1}input{width:100%;text-transform:uppercase;text-align:center;font-size:22px}.hint{font-size:13px;opacity:.75;margin-top:12px}canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#143a6d 0%,#7bd0ff 70%,#dff7ff 100%)}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 3px #000;pointer-events:none}#controls{position:fixed;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:flex;gap:10px;pointer-events:auto}.ctl{width:68px;height:68px;border-radius:50%;background:#ffffffbb;border:3px solid #fff;color:#17345f;font-size:28px;padding:0;box-shadow:0 4px 10px #0004}.fire{width:82px;height:82px;background:#dff7ff}.jump{background:#fff1b5}.hidden{display:none!important}#status{position:fixed;top:45px;width:100%;text-align:center;font-weight:700;text-shadow:0 2px 2px #000;pointer-events:none}</style></head><body>
<div id='menu'><div class='card'><h1>❄️ Snow Pals</h1><div class='sub'>Two-player snowball platform adventure</div><button id='solo'>Practice Solo</button><div class='row'><button id='create'>Create Game</button></div><div class='row'><input id='room' maxlength='6' placeholder='ROOM CODE'><button id='join'>Join</button></div><div class='hint'>For online play this page connects to the included multiplayer server. Turn your phone sideways for the best experience.</div></div></div>
<canvas id='game'></canvas><div id='hud'><span id='score'>Score 0</span><span id='lives'>❤❤❤</span></div><div id='status'></div><div id='controls'><div class='cluster'><button class='ctl' id='left'>◀</button><button class='ctl' id='right'>▶</button></div><div class='cluster'><button class='ctl jump' id='jumpBtn'>⬆</button><button class='ctl fire' id='fire'>❄</button></div></div>
<script src='/socket.io/socket.io.js'></script><script>
const cv=document.querySelector('#game'),cx=cv.getContext('2d'); let W,H,scale=1;function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const menu=document.querySelector('#menu'), statusEl=document.querySelector('#status'); let socket=null,room=null,myId='p1',online=false;
const keys={left:false,right:false};let me={x:80,y:100,vx:0,vy:0,w:30,h:38,on:false,lives:3,score:0},other={x:130,y:100,w:30,h:38},balls=[],enemies=[];const plats=[{x:.05,y:.88,w:.9},{x:.12,y:.68,w:.28},{x:.58,y:.68,w:.28},{x:.35,y:.49,w:.3},{x:.08,y:.3,w:.25},{x:.67,y:.3,w:.25}];
function resetEnemies(){enemies=[{x:.2,y:.2,dir:1,snow:0},{x:.72,y:.2,dir:-1,snow:0},{x:.48,y:.4,dir:1,snow:0},{x:.25,y:.58,dir:1,snow:0},{x:.7,y:.58,dir:-1,snow:0}]};resetEnemies();
function start(){menu.classList.add('hidden');me.x=W*.12;me.y=H*.75;requestAnimationFrame(loop)}
function connect(){if(socket)return;socket=io();socket.on('roomCreated',c=>{room=c;statusEl.textContent='Room '+c+' — send this code to Aariz';start()});socket.on('joined',d=>{room=d.room;myId=d.player;statusEl.textContent='Connected to room '+room;start()});socket.on('peerJoined',()=>statusEl.textContent='Aariz joined!');socket.on('state',s=>{if(s.id!==myId)other={...other,...s.p}});socket.on('snow',b=>balls.push({...b,remote:true}));socket.on('enemyState',e=>enemies=e);}
document.querySelector('#solo').onclick=()=>start();document.querySelector('#create').onclick=()=>{online=true;connect();socket.emit('create')};document.querySelector('#join').onclick=()=>{let c=document.querySelector('#room').value.trim().toUpperCase();if(!c)return;online=true;connect();socket.emit('join',c)};
function bind(id,k){let b=document.querySelector(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=e=>keys[k]=false}bind('#left','left');bind('#right','right');document.querySelector('#jumpBtn').onpointerdown=e=>{e.preventDefault();if(me.on){me.vy=-9.5;me.on=false}};document.querySelector('#fire').onpointerdown=e=>{e.preventDefault();shoot()};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='ArrowUp'&&me.on)me.vy=-9.5;if(e.key===' ')shoot()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
function shoot(){let dir=me.vx<0?-1:1,b={x:me.x+15,y:me.y+12,vx:7*dir,vy:-1,owner:myId};balls.push(b);if(online)socket.emit('snow',{room,b})}
function rectPlatform(p){return{x:p.x*W,y:p.y*H,w:p.w*W,h:12}}
function physics(){me.vx=(keys.right?4.3:0)-(keys.left?4.3:0);me.vy+=.48;let oldY=me.y;me.x+=me.vx;me.y+=me.vy;me.on=false;if(me.x<0)me.x=0;if(me.x>W-me.w)me.x=W-me.w;for(const q of plats){let p=rectPlatform(q);if(me.vy>=0&&oldY+me.h<=p.y+5&&me.y+me.h>=p.y&&me.x+me.w>p.x&&me.x<p.x+p.w){me.y=p.y-me.h;me.vy=0;me.on=true}}if(me.y>H+50){me.lives--;me.x=W*.12;me.y=H*.2;me.vy=0;if(me.lives<=0){me.lives=3;me.score=0}}
balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.04});balls=balls.filter(b=>b.x>-30&&b.x<W+30&&b.y<H+30);for(const e of enemies){e.x+=e.dir*1.15;if(e.x<30||e.x>W-50)e.dir*=-1;for(const b of balls){let ey=e.y*H;if(Math.abs(b.x-e.x)<30&&Math.abs(b.y-ey)<32){e.snow=(e.snow||0)+1;b.x=-100;if(e.snow>=3){me.score+=100;e.x=40+Math.random()*(W-80);e.snow=0}}}let ey=e.y*H;if(Math.abs(me.x-e.x)<25&&Math.abs(me.y-ey)<30){me.vy=-7;me.x-=Math.sign(e.x-me.x)*25}}
if(online){socket.emit('state',{room,id:myId,p:{x:me.x,y:me.y}});if(myId==='p1'&&Math.random()<.08)socket.emit('enemyState',{room,enemies})}}
function drawPlayer(p,c,label){cx.fillStyle=c;cx.beginPath();cx.arc(p.x+15,p.y+12,15,0,7);cx.fill();cx.fillRect(p.x+5,p.y+18,20,20);cx.fillStyle='#fff';cx.fillRect(p.x+8,p.y+7,5,6);cx.fillRect(p.x+18,p.y+7,5,6);cx.fillStyle='#123';cx.font='bold 11px system-ui';cx.textAlign='center';cx.fillText(label,p.x+15,p.y-5)}
function render(){cx.clearRect(0,0,W,H);let g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#173b70');g.addColorStop(.72,'#82d7ff');g.addColorStop(1,'#e8fbff');cx.fillStyle=g;cx.fillRect(0,0,W,H);for(let i=0;i<25;i++){cx.fillStyle='#fff9';cx.beginPath();cx.arc((i*97+performance.now()*.015)%W,(i*61+performance.now()*.025)%H,2+(i%3),0,7);cx.fill()}for(const q of plats){let p=rectPlatform(q);cx.fillStyle='#eafcff';cx.fillRect(p.x,p.y,p.w,p.h);cx.fillStyle='#79bce4';cx.fillRect(p.x,p.y+9,p.w,5)}drawPlayer(me,'#f6c744',myId==='p1'?'Dad':'Aariz');if(online)drawPlayer(other,'#ef668b',myId==='p1'?'Aariz':'Dad');for(const b of balls){cx.fillStyle='#fff';cx.beginPath();cx.arc(b.x,b.y,8,0,7);cx.fill();cx.strokeStyle='#9de4ff';cx.stroke()}for(const e of enemies){let y=e.y*H;cx.fillStyle=e.snow>=2?'#dff8ff':e.snow?'#a9e9ff':'#7856c8';cx.beginPath();cx.arc(e.x,y,17,0,7);cx.fill();cx.fillStyle='#fff';cx.fillRect(e.x-9,y-5,5,5);cx.fillRect(e.x+4,y-5,5,5)}document.querySelector('#score').textContent='Score '+me.score;document.querySelector('#lives').textContent='❤'.repeat(me.lives)}
let last=0;function loop(t){physics();render();requestAnimationFrame(loop)}
</script></body></html>
